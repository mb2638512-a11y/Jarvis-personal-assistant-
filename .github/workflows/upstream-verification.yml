name: Verify Jarvis upstream integrations

on:
  workflow_dispatch:
  push:
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/upstream-verification.yml"
  pull_request:
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/upstream-verification.yml"

permissions:
  contents: read

concurrency:
  group: jarvis-upstream-${{ github.ref }}
  cancel-in-progress: true

jobs:

  shared-backend-smoke:
    name: Test shared cross-platform API scaffold
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Jarvis workspace
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install shared backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Validate API imports and endpoints
        run: |
          python - <<'PY'
          from fastapi.testclient import TestClient
          from backend.core.app import app
          client = TestClient(app)
          assert client.get("/api/v1/health").json() == {"status": "ok", "apiVersion": "1.0.0"}
          for target in ("android", "windows"):
              response = client.get("/api/v1/capabilities", params={"platform": target})
              assert response.status_code == 200
              assert response.json()["platform"] == target
          submitted = client.post(
              "/api/v1/tasks",
              headers={"Idempotency-Key": "ci-test-key-0001"},
              json={"task": "CI smoke test", "platform": "windows", "dryRun": True},
          )
          assert submitted.status_code == 202, submitted.text
          task_id = submitted.json()["taskId"]
          assert client.get(f"/api/v1/tasks/{task_id}").status_code == 200
          assert client.post(f"/api/v1/tasks/{task_id}/cancel").status_code == 202
          print("shared backend API smoke tests passed")
          PY
  atticus-windows:
    name: Clone and test Atticus (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Jarvis workspace
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Clone Atticus upstream
        shell: pwsh
        run: git clone --depth 1 https://github.com/FindlayHi/atticus-windows.git backend/atticus
      - name: Run Atticus unit tests
        working-directory: backend/atticus
        shell: pwsh
        run: |
          $env:PYTHONUTF8 = "1"
          # Git for Windows may shadow native tools (e.g. where.exe) and break
          # Atticus's safety check for Windows-owned executables.
          $native = @("$env:SystemRoot\System32", "$env:SystemRoot")
          $rest = $env:PATH -split ';' | Where-Object { $_ -and $_ -notmatch '(?i)\\Git\\(usr\\bin|mingw64\\bin|bin)' }
          $env:PATH = ($native + $rest) -join ';'
          python -m unittest discover -s tests -v
      - name: Run Atticus brain self-test
        working-directory: backend/atticus
        shell: pwsh
        run: |
          $env:PYTHONUTF8 = "1"
          python atticus.py --selftest

  artemis-linux:
    name: Clone and test ARTEMIS (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Jarvis workspace
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/artemis/uv.lock
      - name: Clone ARTEMIS upstream
        run: git clone --depth 1 https://github.com/google/artemis.git backend/artemis
      - name: Install locked development dependencies
        working-directory: backend/artemis
        run: uv sync --dev --locked
      - name: Run deterministic ARTEMIS tests
        working-directory: backend/artemis
        env:
          NO_COLOR: "1"
          TERM: dumb
          # Unit tests construct provider clients but mock network calls; this
          # placeholder satisfies SDK validation and is not a real credential.
          GOOGLE_API_KEY: "ci-placeholder-not-a-real-key"
        run: |
          printf 'GOOGLE_API_KEY=ci-placeholder-not-a-real-key\n' > .env
          make test
name: Jarvis Windows and Android Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows-source-package:
    name: Package Windows backend source (not an EXE)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install and test backend
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          ruff check .
          pytest -q
      - name: Package source
        shell: pwsh
        run: |
          Compress-Archive -Path jarvis_api, tests, web, pyproject.toml, README.md, .env.example -DestinationPath Jarvis-Windows-Backend-Source.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Jarvis-Windows-Backend-Source
          path: Jarvis-Windows-Backend-Source.zip
          if-no-files-found: error

  windows-desktop-build:
    name: Build Windows desktop app
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build executable
        run: |
          python -m pip install --upgrade pip pyinstaller
          pyinstaller --noconfirm --onefile --windowed --name Jarvis windows/jarvis_desktop.py
      - uses: actions/upload-artifact@v4
        with:
          name: Jarvis-Windows-Desktop
          path: dist/Jarvis.exe
          if-no-files-found: error

  android-build:
    name: Build Android APK if Android project exists
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Detect Android source
        id: detect
        shell: bash
        run: |
          if [ -f gradlew ] || [ -f android/gradlew ] || [ -f pubspec.yaml ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Explain missing Android client
        if: steps.detect.outputs.present == 'false'
        run: |
          echo "No Android/Flutter app source is present in this repository yet. No APK was generated; this prevents publishing a fake or nonfunctional installer." > ANDROID-BUILD-NOT-READY.txt
      - name: Build Flutter APK
        if: steps.detect.outputs.present == 'true' && hashFiles('pubspec.yaml') != ''
        uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Generate missing Flutter Android scaffolding
        if: steps.detect.outputs.present == 'true' && hashFiles('pubspec.yaml') != ''
        run: |
          if [ ! -d android ]; then flutter create --platforms=android .; fi
      - name: Build Flutter release APK
        if: steps.detect.outputs.present == 'true' && hashFiles('pubspec.yaml') != ''
        run: |
          flutter pub get
          flutter build apk --release
      - name: Build Gradle Android APK
        if: steps.detect.outputs.present == 'true' && hashFiles('pubspec.yaml') == ''
        run: |
          chmod +x ./gradlew 2>/dev/null || chmod +x ./android/gradlew
          if [ -f gradlew ]; then ./gradlew assembleRelease; else cd android && ./gradlew assembleRelease; fi
      - name: Upload Android APK
        if: steps.detect.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis-Android-APK
          path: |
            **/build/outputs/apk/release/*.apk
            **/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
      - name: Upload Android status
        if: steps.detect.outputs.present == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: Android-build-not-ready
          path: ANDROID-BUILD-NOT-READY.txt

  publish-release:
    name: Publish downloadable GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows-source-package, windows-desktop-build, android-build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/**/*

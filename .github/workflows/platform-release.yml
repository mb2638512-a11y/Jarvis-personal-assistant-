name: Jarvis Windows and Android Release

on:
  workflow_dispatch:
  push:
    branches:
      - feature/vendor-three-repos
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows-source-package:
    name: Verify backend and package Windows source
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install and test backend
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          ruff check jarvis_api tests windows
          pytest -q
      - name: Package shared backend and integration source
        shell: pwsh
        run: |
          foreach ($repo in @("backend/vendor/postiz-app", "backend/vendor/artemis", "backend/vendor/atticus-windows")) {
            if (!(Test-Path (Join-Path $repo "UPSTREAM_README.md"))) { throw "Vendored upstream source missing: $repo" }
          }
          if (!(Test-Path "backend/vendor/postiz-app/LICENSE")) { throw "Postiz upstream license file missing" }
          Compress-Archive -Path jarvis_api, tests, web, windows, backend/vendor, docs, scripts, pyproject.toml, README.md, .env.example -DestinationPath Jarvis-Windows-Backend-Source.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Jarvis-Windows-Backend-Source
          path: Jarvis-Windows-Backend-Source.zip
          if-no-files-found: error

  windows-desktop-build:
    name: Build Windows desktop EXE
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install build dependencies
        run: python -m pip install --upgrade pip pyinstaller
      - name: Build executable
        run: pyinstaller --noconfirm --clean --onefile --windowed --name Jarvis windows/jarvis_desktop.py
      - name: Verify executable exists
        shell: pwsh
        run: |
          if (!(Test-Path "dist/Jarvis.exe")) { throw "Jarvis.exe was not produced" }
          Get-Item "dist/Jarvis.exe" | Select-Object Name,Length
      - uses: actions/upload-artifact@v4
        with:
          name: Jarvis-Windows-Desktop
          path: dist/Jarvis.exe
          if-no-files-found: error

  android-build:
    name: Build Android release APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Verify Flutter project and create Android scaffolding
        run: |
          flutter --version
          flutter pub get
          if [ ! -d android ]; then flutter create --platforms=android --org com.jarvis.assistant .; fi
      - name: Analyze Flutter app
        run: flutter analyze
      - name: Run Flutter tests
        run: flutter test
      - name: Build release APK
        run: flutter build apk --release
      - name: Verify APK exists
        run: test -s build/app/outputs/flutter-apk/app-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Jarvis-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  publish-release:
    name: Publish downloadable GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows-source-package, windows-desktop-build, android-build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/**/*

name: Jarvis Windows EXE Installer

on:
  push:
    branches: [pc-host]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: jarvis-windows-exe-release
  cancel-in-progress: true

jobs:
  build-installer:
    runs-on: windows-latest
    steps:
      - name: Checkout Jarvis
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build and test Windows app
        shell: pwsh
        run: |
          flutter --version
          if (!(Test-Path "windows/CMakeLists.txt")) {
            flutter create --platforms=windows,android --org com.jarvis.assistant .
          }
          flutter pub get
          flutter analyze --no-fatal-infos
          flutter test
          flutter build windows --release
          $exe = "build/windows/x64/runner/Release/jarvis_personal_assistant.exe"
          if (!(Test-Path $exe)) { throw "Windows app executable missing." }

      - name: Assemble installer payload
        shell: pwsh
        run: |
          $root = "dist/Jarvis-Windows"
          New-Item -ItemType Directory -Force -Path "$root/app", "$root/host" | Out-Null
          Copy-Item "build/windows/x64/runner/Release/*" "$root/app" -Recurse -Force
          Copy-Item ".env.example", "pyproject.toml" "$root/host" -Force
          foreach ($folder in @("jarvis_api", "windows", "scripts", "backend")) {
            if (Test-Path $folder) { Copy-Item $folder "$root/host/$folder" -Recurse -Force }
          }
          if (Test-Path "web") { Copy-Item "web" "$root/host/web" -Recurse -Force }
          Copy-Item "windows-installer/Install-Jarvis.ps1" "$root/Install-Jarvis.ps1" -Force
          Copy-Item "windows-installer/Start-Jarvis.ps1" "$root/Start-Jarvis.ps1" -Force
          if (!(Test-Path "$root/host/scripts/install-windows-host.ps1")) {
            throw "Host installer script missing from payload."
          }
          Compress-Archive -Path "$root/*" -DestinationPath "dist/Jarvis-Windows-x64.zip" -Force

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress
          if (!(Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) {
            throw "Inno Setup compiler was not installed."
          }

      - name: Build single-file Jarvis Setup EXE
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "windows-installer/Jarvis-Setup.iss"
          if (!(Test-Path "dist/Jarvis-Setup.exe")) { throw "Jarvis-Setup.exe was not produced." }
          Get-Item "dist/Jarvis-Setup.exe" | Select-Object Name,Length

      - name: Publish latest Windows installer
        uses: softprops/action-gh-release@v2
        with:
          tag_name: windows-latest
          name: Jarvis Windows — Latest
          body: |
            Single-file Windows x64 installer.

            Download Jarvis-Setup.exe and run it. It installs the Windows app and local PC backend, installs Python 3.11 through winget when needed, creates a desktop shortcut, and starts Jarvis.

            First-run configuration still requires your own AI provider API key and model. External Postiz, ARTEMIS, Tailscale and OAuth services require their own credentials and are not silently provisioned.
          files: |
            dist/Jarvis-Setup.exe
            dist/Jarvis-Windows-x64.zip
          overwrite_files: true
          make_latest: true

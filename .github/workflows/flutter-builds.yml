name: Jarvis Windows and Android builds

on:
  pull_request:
    branches: [pc-host, feature/pc-first-dual-device-integration]
    paths:
      - "lib/**"
      - "pubspec.yaml"
      - "windows-installer/**"
      - "windows-launcher/**"
      - "scripts/**"
      - "jarvis_api/**"
      - "backend/vendor/**"
      - ".github/workflows/flutter-builds.yml"
  push:
    branches: [feature/pc-first-dual-device-integration]
    paths:
      - "lib/**"
      - "pubspec.yaml"
      - "windows-installer/**"
      - "windows-launcher/**"
      - "scripts/**"
      - "jarvis_api/**"
      - "backend/vendor/**"
      - ".github/workflows/flutter-builds.yml"

permissions:
  contents: read

concurrency:
  group: jarvis-\${{ github.workflow }}-\${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  android-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Generate Android platform scaffold
        run: flutter create --platforms=android --project-name jarvis_personal_assistant .
      - name: Set Android minimum SDK for mobile_scanner
        run: |
          python - <<'PY'
          from pathlib import Path
          candidates = [Path("android/app/build.gradle.kts"), Path("android/app/build.gradle")]
          for path in candidates:
              if path.exists():
                  source = path.read_text()
                  source = source.replace("minSdk = flutter.minSdkVersion", "minSdk = 23")
                  source = source.replace("minSdkVersion flutter.minSdkVersion", "minSdkVersion 23")
                  path.write_text(source)
                  break
          else:
              raise SystemExit("Android app Gradle file was not generated.")
          PY
      - name: Resolve Flutter dependencies
        run: flutter pub get
      - name: Analyze Dart source
        run: flutter analyze --no-fatal-infos
      - name: Build release APK
        run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: Jarvis-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Generate Windows platform scaffold
        shell: pwsh
        run: |
          $agent = $null
          if (Test-Path "windows/jarvis_device_agent.py") {
            $agent = Join-Path $env:RUNNER_TEMP "jarvis_device_agent.py"
            Copy-Item "windows/jarvis_device_agent.py" $agent -Force
          }
          if (Test-Path "windows") { Remove-Item "windows" -Recurse -Force }
          flutter create --platforms=windows --project-name jarvis_personal_assistant .
          if ($agent -and (Test-Path $agent)) {
            Copy-Item $agent "windows/jarvis_device_agent.py" -Force
          }
          $runnerMain = "windows/runner/main.cpp"
          if (Test-Path $runnerMain) {
            $runnerSource = Get-Content $runnerMain -Raw
            $runnerSource = $runnerSource.Replace('L"jarvis_personal_assistant"', 'L"Jarvis"')
            Set-Content -Path $runnerMain -Value $runnerSource -Encoding UTF8
          }
      - name: Resolve Flutter dependencies
        run: flutter pub get
      - name: Analyze Dart source
        run: flutter analyze --no-fatal-infos
      - name: Build Windows release app
        run: flutter build windows --release
      - name: Build native silent Windows launcher
        shell: pwsh
        run: |
          dotnet publish windows-launcher/JarvisLauncher.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -o build/launcher
          if (!(Test-Path "build/launcher/Jarvis.exe")) { throw "Native Jarvis launcher was not produced." }
      - name: Stage self-contained Jarvis host and desktop app
        shell: pwsh
        run: |
          $bundle = "build/installer-bundle"
          New-Item -ItemType Directory -Force -Path "$bundle/host", "$bundle/app" | Out-Null
          Copy-Item "jarvis_api" "$bundle/host/jarvis_api" -Recurse -Force
          Copy-Item "backend/vendor" "$bundle/host/backend" -Recurse -Force
          Copy-Item "scripts" "$bundle/host/scripts" -Recurse -Force
          New-Item -ItemType Directory -Force -Path "$bundle/host/windows" | Out-Null
          if (Test-Path "windows/jarvis_device_agent.py") {
            Copy-Item "windows/jarvis_device_agent.py" "$bundle/host/windows/jarvis_device_agent.py" -Force
          }
          Copy-Item "pyproject.toml" "$bundle/host/pyproject.toml" -Force
          Copy-Item ".env.example" "$bundle/host/.env.example" -Force
          Copy-Item "build/windows/x64/runner/Release/*" "$bundle/app" -Recurse -Force
          Copy-Item "windows-installer/Install-Jarvis.ps1" "$bundle/Install-Jarvis.ps1" -Force
          Copy-Item "windows-installer/Start-Jarvis.ps1" "$bundle/Start-Jarvis.ps1" -Force
          Copy-Item "build/launcher/Jarvis.exe" "$bundle/Jarvis.exe" -Force
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Build Windows installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "build/installer-output" | Out-Null
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "windows-installer/Jarvis.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed." }
      - name: Verify installer and launcher
        shell: pwsh
        run: |
          if (!(Test-Path "build/installer-output/Jarvis-Setup.exe")) { throw "Jarvis installer missing." }
          if (!(Test-Path "build/launcher/Jarvis.exe")) { throw "Jarvis launcher missing." }
          Get-Item "build/installer-output/Jarvis-Setup.exe", "build/launcher/Jarvis.exe" | Select-Object Name,Length
      - name: Smoke-test installed Windows application
        shell: pwsh
        run: |
          $installRoot = Join-Path $env:RUNNER_TEMP "Jarvis Smoke Test"
          $installArguments = "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /DIR=`"$installRoot`""
          $installerProcess = Start-Process -FilePath "build/installer-output/Jarvis-Setup.exe" -ArgumentList $installArguments -Wait -PassThru
          if ($installerProcess.ExitCode -ne 0) { throw "Silent Jarvis installation failed with exit code $($installerProcess.ExitCode)." }
          if (!(Test-Path (Join-Path $installRoot "Jarvis.exe"))) { throw "Installed Jarvis.exe is missing." }
          if (!(Test-Path (Join-Path $installRoot "app/jarvis_personal_assistant.exe"))) { throw "Flutter desktop GUI executable is missing." }
          $launcher = Start-Process -FilePath (Join-Path $installRoot "Jarvis.exe") -PassThru
          $healthy = $false
          for ($i = 0; $i -lt 75; $i++) {
            try {
              $response = Invoke-WebRequest -Uri "http://127.0.0.1:8000/health" -UseBasicParsing -TimeoutSec 2
              if ($response.StatusCode -eq 200) { $healthy = $true; break }
            } catch {}
            Start-Sleep -Seconds 1
          }
          if (!$healthy) {
            Write-Host "::group::Jarvis startup diagnostics"
            $logRoot = Join-Path $env:LOCALAPPDATA "Jarvis\logs"
            foreach ($logName in @("launcher.log", "backend.log", "backend-error.log", "agent-error.log")) {
              $logPath = Join-Path $logRoot $logName
              if (Test-Path $logPath) {
                Write-Host "--- $logName ---"
                Get-Content $logPath -Tail 120
              } else { Write-Host "--- $logName not created ---" }
            }
            $installedPython = Join-Path $installRoot "host\.venv\Scripts\python.exe"
            if (Test-Path $installedPython) {
              Write-Host "--- Python import diagnostic ---"
              Push-Location (Join-Path $installRoot "host")
              try { & $installedPython -c "import jarvis_api.main; print('Jarvis API import OK')" 2>&1 } finally { Pop-Location }
            }
            Get-Process -Name "Jarvis", "python", "powershell", "jarvis_personal_assistant" -ErrorAction SilentlyContinue | Select-Object ProcessName,Id,Path
            Write-Host "::endgroup::"
            throw "Installed Jarvis backend did not become healthy within 75 seconds."
          }
          $gui = Get-Process -Name "jarvis_personal_assistant" -ErrorAction SilentlyContinue
          if (!$gui) { throw "Jarvis backend started, but the actual desktop GUI process did not launch." }
          Write-Host "PASS: installer, backend health endpoint, and Flutter desktop GUI launch verified."
      - name: Package portable Windows build
        shell: pwsh
        run: Compress-Archive -Path "build/installer-bundle/app/*" -DestinationPath "build/installer-output/Jarvis-Windows-x64.zip" -Force
      - uses: actions/upload-artifact@v4
        with:
          name: Jarvis-Windows-Installer
          path: |
            build/installer-output/Jarvis-Setup.exe
            build/installer-output/Jarvis-Windows-x64.zip
          if-no-files-found: error
          retention-days: 14

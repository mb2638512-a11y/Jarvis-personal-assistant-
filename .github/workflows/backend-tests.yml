name: Jarvis backend tests

on:
  pull_request:
    branches: [pc-host]
  push:
    branches: [feature/pc-first-dual-device-integration]

permissions:
  contents: read

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install backend and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Compile backend and Windows agent sources
        run: python -m compileall -q jarvis_api windows/jarvis_device_agent.py scripts/start-artemis.py
      - name: Run tests
        env:
          JARVIS_REMOTE_GATEWAY_TOKEN: ci-test-host-token
        run: python -m pytest -q
      - name: Lint all Jarvis-owned backend and test code
        run: ruff check jarvis_api tests scripts/start-artemis.py

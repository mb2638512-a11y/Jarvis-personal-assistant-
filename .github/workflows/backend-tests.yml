name: Jarvis backend tests

on:
  pull_request:
    branches: [pc-host]
  push:
    branches: [feature/pc-first-dual-device-integration]

permissions:
  contents: read

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install backend and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run tests
        env:
          JARVIS_REMOTE_GATEWAY_TOKEN: ci-test-host-token
        run: python -m pytest -q
      - name: Check formatting and lint
        run: ruff check jarvis_api/device_pairing.py jarvis_api/model_catalog.py jarvis_api/provider_vault.py jarvis_api/integration_vault.py jarvis_api/artemis.py jarvis_api/postiz.py tests/test_artemis_auth.py tests/test_chat_auth.py tests/test_device_pairing.py tests/test_model_catalog.py tests/test_provider_vault.py tests/test_integration_vault.py tests/test_postiz.py
